name: Database Availability

on:
  schedule:
    - cron: '23 6 * * 1,3,5'
  workflow_dispatch:

# GitHub may disable schedules in an inactive public repository after 60 days. The owner
# will re-evaluate the scheduler before or around that point; this workflow does not work
# around the platform limitation or restore an already paused Supabase project.
permissions: {}

jobs:
  probe:
    name: Wake server and probe database health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the deployed application and database path to be healthy
        shell: bash
        env:
          APPLICATION_HEALTH_URL: https://chessgame-hit7.onrender.com/health
          DATABASE_HEALTH_URL: https://chessgame-hit7.onrender.com/health/database
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          probe() {
            local phase="$1"
            local url="$2"
            local attempts="$3"
            local retry_delay="$4"
            local require_database_status="$5"

            for attempt in $(seq 1 "$attempts"); do
              set +e
              http_status="$(
                curl \
                  --silent \
                  --output "$response_file" \
                  --write-out '%{http_code}' \
                  --connect-timeout 10 \
                  --max-time 30 \
                  "$url"
              )"
              curl_exit=$?
              set -e

              if [[ "$curl_exit" -eq 0 && "$http_status" == "200" ]]; then
                if [[ "$require_database_status" == true ]]; then
                  if ! grep --quiet --extended-regexp \
                    '^[[:space:]]*\{[[:space:]]*"status"[[:space:]]*:[[:space:]]*"ok"[[:space:]]*\}[[:space:]]*$' \
                    "$response_file"; then
                    echo "$phase returned HTTP 200 without status ok." >&2
                    return 1
                  fi
                fi

                return 0
              fi

              retryable=false
              if [[ "$curl_exit" -ne 0 || "$http_status" == 5?? ]]; then
                retryable=true
              fi

              if [[ "$retryable" != true || "$attempt" -eq "$attempts" ]]; then
                echo "$phase failed (curl=$curl_exit, HTTP=$http_status)." >&2
                return 1
              fi

              sleep "$retry_delay"
            done
          }

          probe \
            "Application wake/liveness phase" \
            "$APPLICATION_HEALTH_URL" \
            "${APPLICATION_WAKE_ATTEMPTS:-8}" \
            "${APPLICATION_WAKE_RETRY_DELAY_SECONDS:-20}" \
            false

          probe \
            "Database health phase" \
            "$DATABASE_HEALTH_URL" \
            "${DATABASE_HEALTH_ATTEMPTS:-3}" \
            "${DATABASE_HEALTH_RETRY_DELAY_SECONDS:-10}" \
            true
