name: CI

on:
  push:
    branches:
      - main
      - claude-autopilot
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # `build` is the single aggregate verification command. It runs, across
      # every module: ktlintCheck (wired into `check`), all JVM unit tests
      # (game-core, server), Android debug + release unit tests, Android lint,
      # the Android APKs, and the server distribution. See docs/DEVELOPMENT.md.
      - name: Build, test, and verify all modules
        run: ./gradlew build
