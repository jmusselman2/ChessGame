name: CI

on:
  push:
    branches:
      - main
      - claude-autopilot
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    # A disposable PostgreSQL so the server's integration tests run for real here
    # rather than skipping. It mirrors the local database in docs/DEVELOPMENT.md;
    # the credentials are throwaway CI values.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chessgame
          POSTGRES_PASSWORD: chessgame
          POSTGRES_DB: chessgame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chessgame -d chessgame_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://chessgame:chessgame@localhost:5432/chessgame_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # `build` is the single aggregate verification command. It runs, across
      # every module: ktlintCheck (wired into `check`), all JVM unit tests
      # (game-core, server), Android debug + release unit tests, Android lint,
      # the Android APKs, and the server distribution. See docs/DEVELOPMENT.md.
      #
      # `--continue` so a red run reports every failing task rather than the
      # first one Gradle happens to reach. Without it, whether `:server:test`
      # or `:android-app:testDebugUnitTest` gets to run depends on scheduling,
      # so the same broken commit can report a different set of failures each
      # time and the outstanding count cannot be read off one run. It does not
      # change the verdict: dependent tasks are still skipped, and the build
      # still fails if anything failed.
      - name: Build, test, and verify all modules
        run: ./gradlew build --continue
